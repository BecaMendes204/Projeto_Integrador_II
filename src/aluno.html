<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1>Área do Aluno</h1>
    <button id="btn-sair">Sair</button>
  </header>

  <main>
    <section class="cartao">
      <h2>Registrar dificuldade</h2>
      <form id="form-dificuldade">
        <label for="disciplina">Disciplina</label>
        <input type="text" id="disciplina" required placeholder="Ex: Matemática">

        <label for="conteudo">Conteúdo</label>
        <input type="text" id="conteudo" required placeholder="Ex: Funções">

        <label for="nivel">Nível de dificuldade</label>
        <select id="nivel" required>
          <option value="Fácil">Fácil</option>
          <option value="Médio">Médio</option>
          <option value="Difícil">Difícil</option>
        </select>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" required placeholder="Descreva sua dificuldade"></textarea>

        <button type="submit">Registrar dificuldade</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Meus registros</h2>
      <div id="lista-registros"></div>
    </section>
  </main>

  <script type="module" src="js/aluno.js"></script>
</body>
</html>
